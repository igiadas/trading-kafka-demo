# Settings come from a .env file next to this one (see .env.example). Everything has a default,
# so "docker compose up" works without any .env: simulated prices, alerts in the log.
name: kotiz

services:
  # Single Kafka node in KRaft mode: it is both broker and controller, no ZooKeeper.
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"   # for clients running on your machine (e.g. dotnet run)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092). EXTERNAL: your machine (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, never by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates the topics once Kafka is up, then exits.
  # orders.placed and market.quotes MUST have the same number of partitions: the order processor
  # relies on it to receive the orders and the prices of a symbol in the same consumer.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --replication-factor 1 --partitions 3 --topic "$$@"
        }
        create orders.placed
        create orders.executed
        # Compacted: Kafka keeps (at least) the latest price of every symbol, forever.
        create market.quotes --config cleanup.policy=compact --config segment.ms=600000
        create orders.placed.dlt
        create market.quotes.dlt
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe

  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  market-data:
    build:
      context: .
      dockerfile: src/Kotiz.MarketData/Dockerfile
    environment:
      Kafka__BootstrapServers: kafka:29092
      Market__Source: ${MARKET_DATA_SOURCE:-Simulated}
      Market__Symbols: ${SYMBOLS:-AAPL,MSFT,NVDA,TSLA,AMZN}
      Market__FinnhubApiKey: ${FINNHUB_API_KEY:-}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  order-api:
    build:
      context: .
      dockerfile: src/Kotiz.OrderApi/Dockerfile
    ports:
      - "5080:8080"
    environment:
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Scale it to see the consumer group split the partitions:
  #   docker compose up -d --scale order-processor=3
  order-processor:
    build:
      context: .
      dockerfile: src/Kotiz.OrderProcessor/Dockerfile
    environment:
      Kafka__BootstrapServers: kafka:29092
      Market__Symbols: ${SYMBOLS:-AAPL,MSFT,NVDA,TSLA,AMZN}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  alerts:
    build:
      context: .
      dockerfile: src/Kotiz.Alerts/Dockerfile
    environment:
      Kafka__BootstrapServers: kafka:29092
      Alerts__TelegramBotToken: ${TELEGRAM_BOT_TOKEN:-}
      Alerts__TelegramChatId: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
